<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>
  <!-- Architectural Dark Blueprint Base -->
  <rect width="1000" height="700" fill="#0d1526"/>
  <rect width="1000" height="700" fill="url(#grid)"/>

  <!-- Campus Perimeter Boundary -->
  <rect x="35" y="35" width="930" height="630" rx="22" fill="#101b30" stroke="#334155" stroke-width="2.5" stroke-dasharray="10 6"/>

  <!-- Green Lawn & Central Quad -->
  <rect x="400" y="290" width="180" height="150" rx="16" fill="#0f2b27" stroke="#1f5a4f" stroke-width="1.5"/>
  <text x="490" y="362" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="600" opacity="0.8">CENTRAL QUAD</text>
  <text x="490" y="381" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" opacity="0.6">Pedestrian Lawn</text>

  <!-- Main Campus Paved Walkways (matches graph coordinates) -->
  <g fill="none" stroke="#293a54" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 120 600 L 260 546 L 340 420 L 340 294"/>
    <path d="M 260 546 L 680 504 L 660 266"/>
    <path d="M 340 294 L 660 266"/>
    <path d="M 340 294 L 240 154"/>
    <path d="M 120 600 L 140 476 L 260 546"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7">
    <path d="M 120 600 L 260 546 L 340 420 L 340 294 L 660 266 L 680 504 L 260 546"/>
    <path d="M 340 294 L 240 154"/>
  </g>

  <!-- Building Footprints -->
  <!-- Hostel Block A (24%, 22%) -->
  <g>
    <rect x="145" y="90" width="190" height="115" rx="12" fill="#17253e" stroke="#3b82f6" stroke-width="2"/>
    <text x="240" y="138" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="700">HOSTEL BLOCK A</text>
    <text x="240" y="160" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">RESIDENTIAL WING · RO WATER</text>
  </g>

  <!-- Engineering Block B (34%, 42%) -->
  <g>
    <rect x="220" y="230" width="230" height="135" rx="12" fill="#1b2a44" stroke="#ea580c" stroke-width="2.5"/>
    <text x="335" y="286" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">ENGINEERING BLOCK B</text>
    <text x="335" y="308" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="11">GROUND + 2ND FLOOR MAPS</text>
    <text x="335" y="328" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">CSE · IT · Labs · Seminar Hall</text>
  </g>

  <!-- Central Academic & Library Block (66%, 38%) -->
  <g>
    <rect x="570" y="195" width="230" height="135" rx="12" fill="#17253e" stroke="#38bdf8" stroke-width="2"/>
    <text x="685" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="700">CENTRAL LIBRARY</text>
    <text x="685" y="274" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="11">ACADEMIC &amp; READING HALL</text>
    <text x="685" y="294" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Admin · Exam Cell · Archives</text>
  </g>

  <!-- Student Amenities & Canteen (68%, 72%) -->
  <g>
    <rect x="595" y="455" width="205" height="110" rx="12" fill="#17253e" stroke="#f59e0b" stroke-width="2"/>
    <text x="698" y="502" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="700">AMENITIES &amp; CANTEEN</text>
    <text x="698" y="524" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="11">DINING · STUDENT COMMONS</text>
  </g>

  <!-- Security & Lost-and-Found Desk (26%, 78%) -->
  <g>
    <rect x="195" y="510" width="150" height="72" rx="10" fill="#162a3a" stroke="#10b981" stroke-width="2"/>
    <text x="270" y="542" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SECURITY &amp; HELP DESK</text>
    <text x="270" y="560" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10">LOST &amp; FOUND CUSTODY</text>
  </g>

  <!-- Two-Wheeler Parking (14%, 68%) -->
  <g>
    <rect x="70" y="435" width="115" height="82" rx="10" fill="#142034" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="128" y="472" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PARKING BAY</text>
    <text x="128" y="490" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ZONE P1</text>
  </g>

  <!-- Main Campus Gate (12%, 86%) -->
  <g>
    <rect x="55" y="575" width="130" height="54" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="120" y="600" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">MAIN CAMPUS GATE</text>
    <text x="120" y="617" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">ACCESSIBLE ENTRY</text>
  </g>

  <!-- Compass & Scale Bar -->
  <g transform="translate(885, 90)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <polygon points="0,-16 5,2 0,-2 -5,2" fill="#ea580c"/>
    <polygon points="0,16 5,-2 0,2 -5,-2" fill="#64748b"/>
    <text x="0" y="-29" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="700">N</text>
  </g>
  <g transform="translate(770, 625)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#94a3b8" stroke-width="2"/>
    <line x1="140" y1="-5" x2="140" y2="5" stroke="#94a3b8" stroke-width="2"/>
    <text x="70" y="-8" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">SCALE: 40 METERS</text>
  </g>
</svg>
