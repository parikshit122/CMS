<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <pattern id="ggrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="#0b1322"/>
  <rect width="1000" height="700" fill="url(#ggrid)"/>

  <!-- Building Shell -->
  <rect x="60" y="55" width="880" height="590" rx="14" fill="#111d33" stroke="#475569" stroke-width="3"/>

  <!-- Main Corridor Band -->
  <rect x="120" y="295" width="760" height="105" rx="8" fill="#182742" stroke="#334155" stroke-width="1.5"/>
  <rect x="295" y="395" width="105" height="210" rx="8" fill="#182742" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="352" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="13" letter-spacing="3">GROUND FLOOR CENTRAL CORRIDOR</text>

  <!-- Top Wing Rooms -->
  <!-- Seminar Hall (18%, 24%) -->
  <rect x="85" y="80" width="225" height="185" rx="8" fill="#16243d" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="197" y="160" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SEMINAR HALL</text>
  <text x="197" y="182" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="11">ROOM G-101 · 180 SEATS</text>

  <!-- Staircase B (34%, 28%) -->
  <rect x="325" y="110" width="105" height="155" rx="8" fill="#231c2e" stroke="#f59e0b" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-width="1.5" opacity="0.55">
    <line x1="340" y1="145" x2="415" y2="145"/>
    <line x1="340" y1="163" x2="415" y2="163"/>
    <line x1="340" y1="181" x2="415" y2="181"/>
    <line x1="340" y1="199" x2="415" y2="199"/>
    <line x1="340" y1="217" x2="415" y2="217"/>
  </g>
  <text x="377" y="132" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="700">STAIRS B</text>

  <!-- Restrooms (50%, 20%) -->
  <rect x="445" y="80" width="145" height="185" rx="8" fill="#16243d" stroke="#64748b" stroke-width="1.5"/>
  <text x="517" y="162" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="700">RESTROOMS</text>
  <text x="517" y="182" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ACCESSIBLE WC</text>

  <!-- Accessible Elevator 1 (66%, 28%) -->
  <rect x="605" y="110" width="115" height="155" rx="8" fill="#0f2b27" stroke="#10b981" stroke-width="2.2"/>
  <text x="662" y="168" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ELEVATOR 1</text>
  <text x="662" y="188" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">WHEELCHAIR LIFT</text>

  <!-- Academic Dean & HOD Office (82%, 24%) -->
  <rect x="735" y="80" width="180" height="185" rx="8" fill="#16243d" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="825" y="158" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DEAN &amp; ADMIN</text>
  <text x="825" y="178" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="11">ROOM G-104</text>

  <!-- Bottom Wing -->
  <!-- Entrance + Ramp (16%, 78%) -->
  <rect x="85" y="455" width="190" height="165" rx="8" fill="#0f2924" stroke="#22c55e" stroke-width="2"/>
  <text x="180" y="528" text-anchor="middle" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="14" font-weight="700">MAIN ENTRANCE</text>
  <text x="180" y="548" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="10">DIVYANGJAN RAMP ENTRY</text>

  <!-- Lobby Help Desk (52%, 72%) -->
  <rect x="425" y="455" width="235" height="165" rx="8" fill="#16243d" stroke="#ea580c" stroke-width="1.8"/>
  <text x="542" y="528" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">RECEPTION &amp; HELP DESK</text>
  <text x="542" y="548" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="10">QR DIRECTORY · INFO</text>

  <!-- Mechanical & Robotics Workshop (82%, 72%) -->
  <rect x="680" y="455" width="235" height="165" rx="8" fill="#16243d" stroke="#64748b" stroke-width="1.8"/>
  <text x="797" y="528" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ROBOTICS WORKSHOP</text>
  <text x="797" y="548" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ROOM G-108 · LAB</text>

  <!-- Floor Title Tag -->
  <text x="85" y="42" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700">ENGINEERING BLOCK B — GROUND FLOOR (60m × 42m)</text>
</svg>
