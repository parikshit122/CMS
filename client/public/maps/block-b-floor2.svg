  <rect x="85" y="435" width="245" height="185" rx="8" fill="#16243d" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="207" y="520" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">CSE DEPT &amp; HOD CABIN</text>
  <text x="207" y="542" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="11">FACULTY WING · ROOM 204</text>

  <!-- Smart Lecture Hall 205 (50%, 72%) -->
  <rect x="355" y="435" width="275" height="185" rx="8" fill="#16243d" stroke="#64748b" stroke-width="1.8"/>
  <text x="492" y="520" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SMART CLASSROOM 205</text>
  <text x="492" y="542" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">LECTURE HALL · 90 SEATS</text>

