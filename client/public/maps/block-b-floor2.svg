  <rect x="655" y="435" width="260" height="185" rx="8" fill="#1b263b" stroke="#22c55e" stroke-width="2"/>
  <text x="785" y="520" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">INNOVATION &amp; R&amp;D CELL</text>
  <text x="785" y="542" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11">PROTOTYPE LAB · ROOM 206</text>

  <!-- Floor Title Tag -->
  <text x="85" y="42" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700">ENGINEERING BLOCK B — 2ND FLOOR (60m × 42m)</text>
